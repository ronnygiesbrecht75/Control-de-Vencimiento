<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#0a4d28" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Badge Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle border outline -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Spreadsheet Grid Sheet Motif -->
  <g transform="translate(80, 80)">
    <!-- Sheet Card White/Soft Panel -->
    <rect x="12" y="16" width="328" height="320" rx="28" fill="#ffffff" filter="url(#dropShadow)" />
    
    <!-- Table Header Green Bar -->
    <rect x="12" y="16" width="328" height="74" rx="28" fill="#107c41" />
    <rect x="12" y="60" width="328" height="30" fill="#107c41" />
    
    <!-- Header Grid Columns -->
    <line x1="120" y1="28" x2="120" y2="78" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="228" y1="28" x2="228" y2="78" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    
    <!-- Row 1 -->
    <rect x="36" y="112" width="60" height="18" rx="6" fill="#107c41" fill-opacity="0.85" />
    <rect x="116" y="112" width="90" height="18" rx="6" fill="#e2e8f0" />
    <rect x="224" y="112" width="90" height="18" rx="6" fill="#dcfce7" />

    <!-- Row 2 -->
    <rect x="36" y="152" width="60" height="18" rx="6" fill="#107c41" fill-opacity="0.7" />
    <rect x="116" y="152" width="80" height="18" rx="6" fill="#e2e8f0" />
    <rect x="224" y="152" width="90" height="18" rx="6" fill="#dcfce7" />

    <!-- Row 3 -->
    <rect x="36" y="192" width="60" height="18" rx="6" fill="#107c41" fill-opacity="0.7" />
    <rect x="116" y="192" width="100" height="18" rx="6" fill="#e2e8f0" />
    <rect x="224" y="192" width="70" height="18" rx="6" fill="#dcfce7" />

    <!-- Floating Expiration Checkmark Badge on Bottom Right -->
    <g transform="translate(190, 180)" filter="url(#dropShadow)">
      <circle cx="80" cy="80" r="72" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="8" />
      <!-- Calendar Expiration Check Icon -->
      <path d="M50 82 L72 104 L114 58" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
